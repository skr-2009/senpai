<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>先輩とつながる</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="home-screen" class="screen active">
        <h1>先輩とつながる</h1>
        <p class="subtitle">話してみたい先輩を、気軽に見つけよう。</p>
        <button id="start-btn" class="btn primary">はじめる</button>
      </section>

      <section id="card-screen" class="screen">
        <header class="top-bar">
          <h2>プロフィールカード</h2>
          <div class="top-actions">
            <button id="notifications-btn" class="btn ghost" type="button">
              お知らせ
              <span id="notif-badge" class="notif-badge">0</span>
            </button>
            <button id="show-hearts-btn" class="btn ghost">ハート確認</button>
            <button id="show-chat-btn" class="btn ghost">お話し予定</button>
          </div>
        </header>

        <article id="profile-card" class="profile-card" aria-live="polite"></article>

        <div id="card-actions" class="actions">
          <button id="skip-btn" class="btn skip" type="button">また今度</button>
          <button id="heart-btn" class="btn heart" type="button">興味あり ❤</button>
        </div>
        <p id="feedback" class="feedback" role="status"></p>
      </section>

      <section id="hearts-screen" class="screen">
        <header class="top-bar">
          <h2>ハート確認</h2>
          <button id="back-to-cards-btn" class="btn ghost">カードに戻る</button>
        </header>

        <div class="hearts-grid">
          <section>
            <h3>自分が送ったハート</h3>
            <ul id="sent-hearts-list" class="heart-list person-list"></ul>
          </section>
          <section>
            <h3>自分に届いたハート</h3>
            <ul id="received-hearts-list" class="heart-list person-list"></ul>
          </section>
        </div>
      </section>

      <section id="notifications-screen" class="screen">
        <header class="top-bar">
          <h2>受信メールボックス</h2>
          <button id="back-from-notifications-btn" class="btn ghost">カードに戻る</button>
        </header>
        <ul id="inbox-list" class="inbox-list"></ul>
      </section>

      <section id="chat-screen" class="screen">
        <header class="top-bar">
          <h2>お話し予定</h2>
          <button id="back-from-chat-btn" class="btn ghost">カードに戻る</button>
        </header>

        <div class="chat-layout">
          <aside>
            <h3>お話し候補の先輩</h3>
            <ul id="chat-candidates-list" class="heart-list person-list"></ul>
          </aside>

          <section class="chat-panel">
            <h3 id="chat-target-title">先輩を選んで予定を決めよう</h3>
            <p class="availability-title">先輩の空き時間</p>
            <ul id="availability-list" class="inbox-list"></ul>

            <form id="chat-plan-form" class="chat-form">
              <label>
                日時
                <input id="chat-date" type="datetime-local" required />
              </label>
              <label>
                場所
                <input id="chat-place" type="text" maxlength="60" placeholder="例：図書館1Fラウンジ" required />
              </label>
              <label>
                メッセージ
                <textarea id="chat-note" rows="3" maxlength="180" placeholder="例：授業の相談をしたいです"></textarea>
              </label>
              <button class="btn primary" type="submit">予定を保存</button>
            </form>

            <ul id="chat-schedule-list" class="inbox-list"></ul>
          </section>
        </div>
      </section>
    </main>

    <div id="notification-toast" class="notification-toast" role="status" aria-live="polite"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
